<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>سیستم اتوماسیون کلینیک زیبایی</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;500;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Vazirmatn', sans-serif; }
    </style>
</head>
<body class="bg-slate-50 text-slate-800 min-h-screen pb-12">

    <!-- ناوبری بالای صفحه -->
    <header class="bg-indigo-600 text-white shadow-lg p-4 sticky top-0 z-50">
        <div class="container mx-auto flex flex-wrap justify-between items-center">
            <h1 class="text-xl font-bold">✨ سیستم اتوماسیون کلینیک</h1>
            <nav class="flex gap-2 mt-2 md:mt-0 overflow-x-auto">
                <button onclick="switchTab('scanner')" class="tab-btn bg-indigo-700 px-3 py-1.5 rounded-lg text-sm font-medium transition">اسکن کارت / کلاینت</button>
                <button onclick="switchTab('clients')" class="tab-btn bg-indigo-800/60 px-3 py-1.5 rounded-lg text-sm font-medium transition">ثبت کلاینت</button>
                <button onclick="switchTab('services')" class="tab-btn bg-indigo-800/60 px-3 py-1.5 rounded-lg text-sm font-medium transition">مدیریت لاین‌ها و خدمات</button>
                <button onclick="switchTab('treatments')" class="tab-btn bg-indigo-800/60 px-3 py-1.5 rounded-lg text-sm font-medium transition">تخصیص دوره درمانی</button>
            </nav>
        </div>
    </header>

    <main class="container mx-auto mt-6 px-4 max-w-4xl">

        <!-- تب ۱: اسکن کارت و بررسی کلاینت -->
        <section id="tab-scanner" class="tab-content">
            <div class="bg-white p-6 rounded-2xl shadow-sm border border-slate-100 mb-6">
                <h2 class="text-lg font-bold mb-4 text-indigo-600">💳 اسکن کارت اتوماسیون یا جستجوی کلاینت</h2>
                <div class="flex gap-2">
                    <input type="text" id="search-card-input" placeholder="شماره کارت اتوماسیون را وارد یا اسکن کنید..." class="flex-1 border rounded-xl px-4 py-2 focus:outline-none focus:ring-2 focus:ring-indigo-500">
                    <button onclick="searchClientByCard()" class="bg-indigo-600 text-white px-6 py-2 rounded-xl hover:bg-indigo-700 transition">بررسی کارت</button>
                </div>
            </div>

            <div id="client-result" class="hidden space-y-4">
                <!-- اطلاعات کلاینت -->
                <div class="bg-white p-6 rounded-2xl shadow-sm border border-slate-100 flex justify-between items-center flex-wrap gap-4">
                    <div>
                        <h3 id="res-name" class="text-xl font-bold"></h3>
                        <p class="text-slate-500 text-sm mt-1">تلفن: <span id="res-phone"></span> | شماره کارت: <span id="res-card"></span></p>
                    </div>
                    <div id="res-rank-badge" class="px-4 py-2 rounded-xl text-white font-bold text-sm shadow"></div>
                </div>

                <!-- روندهای درمانی کلاینت -->
                <div class="bg-white p-6 rounded-2xl shadow-sm border border-slate-100">
                    <h3 class="font-bold text-lg mb-4">🩺 روند درمانی و جلسات فعال</h3>
                    <div id="res-treatments-list" class="space-y-4">
                        <!-- لیست جلسات اینجا لود می‌شود -->
                    </div>
                </div>
            </div>
        </section>

        <!-- تب ۲: ثبت کلاینت جدید -->
        <section id="tab-clients" class="tab-content hidden">
            <div class="bg-white p-6 rounded-2xl shadow-sm border border-slate-100">
                <h2 class="text-lg font-bold mb-4 text-indigo-600">👤 ثبت کلاینت جدید</h2>
                <form onsubmit="handleClientSubmit(event)" class="space-y-4">
                    <div>
                        <label class="block text-sm font-medium mb-1">نام و نام خانوادگی</label>
                        <input type="text" id="client-name" required class="w-full border rounded-xl px-4 py-2 focus:ring-2 focus:ring-indigo-500">
                    </div>
                    <div>
                        <label class="block text-sm font-medium mb-1">شماره تماس</label>
                        <input type="text" id="client-phone" required class="w-full border rounded-xl px-4 py-2 focus:ring-2 focus:ring-indigo-500">
                    </div>
                    <div>
                        <label class="block text-sm font-medium mb-1">شماره کارت اتوماسیون (فیزیکی/بارکد)</label>
                        <input type="text" id="client-card" required class="w-full border rounded-xl px-4 py-2 focus:ring-2 focus:ring-indigo-500">
                    </div>
                    <div>
                        <label class="block text-sm font-medium mb-1">رتبه رنگی کلاینت (و تخفیف مربوطه)</label>
                        <select id="client-rank" class="w-full border rounded-xl px-4 py-2 focus:ring-2 focus:ring-indigo-500">
                            <option value="1">برنزی (۵ درصد تخفیف)</option>
                            <option value="2">نقره‌ای (۱۰ درصد تخفیف)</option>
                            <option value="3">طلایی (۱۵ درصد تخفیف)</option>
                            <option value="4">VIP - مشکی (۲۵ درصد تخفیف)</option>
                        </select>
                    </div>
                    <button type="submit" class="w-full bg-indigo-600 text-white py-3 rounded-xl font-bold hover:bg-indigo-700 transition">ثبت و ذخیره کلاینت</button>
                </form>
            </div>
        </section>

        <!-- تب ۳: مدیریت لاین‌ها و خدمات -->
        <section id="tab-services" class="tab-content hidden">
            <div class="bg-white p-6 rounded-2xl shadow-sm border border-slate-100 mb-6">
                <h2 class="text-lg font-bold mb-4 text-indigo-600">⚙️ افزودن خدمت جدید به لاین‌ها</h2>
                <form onsubmit="handleServiceSubmit(event)" class="space-y-4">
                    <div>
                        <label class="block text-sm font-medium mb-1">انتخاب لاین تخصصی</label>
                        <select id="service-line" class="w-full border rounded-xl px-4 py-2 focus:ring-2 focus:ring-indigo-500">
                            <option value="laser">لاین لیزر</option>
                            <option value="massage">لاین ماساژ</option>
                            <option value="skin_hair">لاین پوست و مو</option>
                        </select>
                    </div>
                    <div>
                        <label class="block text-sm font-medium mb-1">نام خدمت</label>
                        <input type="text" id="service-name" placeholder="مثلاً: لیزر فول‌بادی / پاکسازی صورت" required class="w-full border rounded-xl px-4 py-2 focus:ring-2 focus:ring-indigo-500">
                    </div>
                    <div>
                        <label class="block text-sm font-medium mb-1">قیمت پایه (تومان)</label>
                        <input type="number" id="service-price" required class="w-full border rounded-xl px-4 py-2 focus:ring-2 focus:ring-indigo-500">
                    </div>
                    <button type="submit" class="w-full bg-indigo-600 text-white py-3 rounded-xl font-bold hover:bg-indigo-700 transition">افزودن خدمت</button>
                </form>
            </div>

            <!-- لیست خدمات موجود -->
            <div class="bg-white p-6 rounded-2xl shadow-sm border border-slate-100">
                <h3 class="font-bold text-mb mb-4">لیست خدمات تعریف شده</h3>
                <div id="services-list" class="space-y-2"></div>
            </div>
        </section>

        <!-- تب ۴: تخصیص روند درمانی -->
        <section id="tab-treatments" class="tab-content hidden">
            <div class="bg-white p-6 rounded-2xl shadow-sm border border-slate-100">
                <h2 class="text-lg font-bold mb-4 text-indigo-600">📋 تخصیص دوره و جلسات درمانی به کلاینت</h2>
                <form onsubmit="handleTreatmentSubmit(event)" class="space-y-4">
                    <div>
                        <label class="block text-sm font-medium mb-1">انتخاب کلاینت</label>
                        <select id="treatment-client" required class="w-full border rounded-xl px-4 py-2 focus:ring-2 focus:ring-indigo-500"></select>
                    </div>
                    <div>
                        <label class="block text-sm font-medium mb-1">انتخاب خدمت</label>
                        <select id="treatment-service" required class="w-full border rounded-xl px-4 py-2 focus:ring-2 focus:ring-indigo-500"></select>
                    </div>
                    <div>
                        <label class="block text-sm font-medium mb-1">تعداد کل جلسات دوره</label>
                        <input type="number" id="treatment-total-sessions" value="4" min="1" required class="w-full border rounded-xl px-4 py-2 focus:ring-2 focus:ring-indigo-500">
                    </div>
                    <button type="submit" class="w-full bg-indigo-600 text-white py-3 rounded-xl font-bold hover:bg-indigo-700 transition">تخصیص دوره</button>
                </form>
            </div>
        </section>

    </main>

    <script>
        // دیتای پایه در LocalStorage
        const defaultData = {
            ranks: [
                { id: 1, name: 'برنزی', color: 'bg-amber-700', discount: 5 },
                { id: 2, name: 'نقره‌ای', color: 'bg-slate-400', discount: 10 },
                { id: 3, name: 'طلایی', color: 'bg-amber-500', discount: 15 },
                { id: 4, name: 'VIP (مشکی)', color: 'bg-slate-900', discount: 25 }
            ],
            clients: [],
            services: [
                { id: 1, line_name: 'laser', service_name: 'لیزر کل بدن', base_price: 1200000 },
                { id: 2, line_name: 'massage', service_name: 'ماساژ ریلکسی', base_price: 600000 },
                { id: 3, line_name: 'skin_hair', service_name: 'فیشیال تخصصی پوست', base_price: 900000 }
            ],
            treatments: []
        };

        function getDB() {
            let data = localStorage.getItem('clinic_db');
            if (!data) {
                data = JSON.stringify(defaultData);
                localStorage.setItem('clinic_db', data);
            }
            return JSON.parse(data);
        }

        function saveDB(data) {
            localStorage.setItem('clinic_db', JSON.stringify(data));
        }

        // مدیریت تب‌ها
        function switchTab(tabId) {
            document.querySelectorAll('.tab-content').forEach(el => el.classList.add('hidden'));
            document.getElementById('tab-' + tabId).classList.remove('hidden');

            document.querySelectorAll('.tab-btn').forEach(btn => {
                btn.classList.remove('bg-indigo-700');
                btn.classList.add('bg-indigo-800/60');
            });
            event.target.classList.add('bg-indigo-700');
            event.target.classList.remove('bg-indigo-800/60');

            if (tabId === 'treatments') loadSelectOptions();
            if (tabId === 'services') renderServicesList();
        }

        // ثبت کلاینت
        function handleClientSubmit(e) {
            e.preventDefault();
            const db = getDB();
            const name = document.getElementById('client-name').value;
            const phone = document.getElementById('client-phone').value;
            const card_id = document.getElementById('client-card').value;
            const rank_id = parseInt(document.getElementById('client-rank').value);

            if(db.clients.some(c => c.card_id === card_id)) {
                alert('این شماره کارت قبلاً ثبت شده است!');
                return;
            }

            db.clients.push({ id: Date.now(), name, phone, card_id, rank_id });
            saveDB(db);
            alert('کلاینت با موفقیت ثبت شد!');
            e.target.reset();
        }

        // جستجو با کارت اتوماسیون
        function searchClientByCard() {
            const cardId = document.getElementById('search-card-input').value.trim();
            const db = getDB();
            const client = db.clients.find(c => c.card_id === cardId);

            if (!client) {
                alert('کلاینتی با این شماره کارت یافت نشد.');
                document.getElementById('client-result').classList.add('hidden');
                return;
            }

            const rank = db.ranks.find(r => r.id === client.rank_id) || db.ranks[0];
            const treatments = db.treatments.filter(t => t.client_id === client.id);

            document.getElementById('res-name').innerText = client.name;
            document.getElementById('res-phone').innerText = client.phone;
            document.getElementById('res-card').innerText = client.card_id;
            
            const badge = document.getElementById('res-rank-badge');
            badge.className = `px-4 py-2 rounded-xl text-white font-bold text-sm shadow ${rank.color}`;
            badge.innerText = `رتبه: ${rank.name} (${rank.discount}% تخفیف)`;

            let html = '';
            if (treatments.length === 0) {
                html = '<p class="text-slate-400 text-sm">هیچ دوره درمانی فعالی برای این کلاینت ثبت نشده است.</p>';
            } else {
                treatments.forEach(t => {
                    const srv = db.services.find(s => s.id === t.service_id) || { service_name: 'خدمت نامشخص', line_name: '-' };
                    const remaining = t.total_sessions - t.completed_sessions;
                    const percent = Math.round((t.completed_sessions / t.total_sessions) * 100);

                    html += `
                        <div class="border border-slate-100 bg-slate-50 p-4 rounded-xl flex flex-col md:flex-row justify-between items-start md:items-center gap-4">
                            <div>
                                <span class="text-xs bg-indigo-100 text-indigo-700 px-2.5 py-1 rounded-md font-bold">${srv.line_name.toUpperCase()}</span>
                                <h4 class="font-bold text-lg mt-1">${srv.service_name}</h4>
                                <p class="text-sm text-slate-600 mt-1">
                                    انجام‌شده: <span class="font-bold text-indigo-600">${t.completed_sessions}</span> | 
                                    باقی‌مانده: <span class="font-bold text-emerald-600">${remaining}</span> از کل ${t.total_sessions} جلسه
                                </p>
                            </div>
                            <div class="flex items-center gap-3 w-full md:w-auto justify-end">
                                <button onclick="completeSession(${t.id})" class="bg-emerald-600 hover:bg-emerald-700 text-white px-4 py-2 rounded-xl text-sm font-bold transition">ثبت انجام ۱ جلسه +</button>
                            </div>
                        </div>
                    `;
                });
            }

            document.getElementById('res-treatments-list').innerHTML = html;
            document.getElementById('client-result').classList.remove('hidden');
        }

        // ثبت پیشرفت جلسه (+1)
        function completeSession(treatmentId) {
            const db = getDB();
            const t = db.treatments.find(item => item.id === treatmentId);
            if (t && t.completed_sessions < t.total_sessions) {
                t.completed_sessions++;
                saveDB(db);
                searchClientByCard(); // رفرش نتایج
            } else {
                alert('تمام جلسات این دوره کامل شده است!');
            }
        }

        // افزودن خدمت
        function handleServiceSubmit(e) {
            e.preventDefault();
            const db = getDB();
            const line_name = document.getElementById('service-line').value;
            const service_name = document.getElementById('service-name').value;
            const base_price = parseFloat(document.getElementById('service-price').value);

            db.services.push({ id: Date.now(), line_name, service_name, base_price });
            saveDB(db);
            alert('خدمت جدید اضافه شد!');
            e.target.reset();
            renderServicesList();
        }

        // رندر لیست خدمات با امکان حذف
        function renderServicesList() {
            const db = getDB();
            const listEl = document.getElementById('services-list');
            if (db.services.length === 0) {
                listEl.innerHTML = '<p class="text-slate-400 text-sm">خدمتی ثبت نشده است.</p>';
                return;
            }
            let html = '';
            db.services.forEach(s => {
                html += `
                    <div class="flex justify-between items-center border-b pb-2">
                        <div>
                            <span class="text-xs bg-slate-200 px-2 py-0.5 rounded">${s.line_name}</span>
                            <span class="font-bold mr-2">${s.service_name}</span>
                        </div>
                        <div class="flex items-center gap-4">
                            <span class="text-sm font-semibold text-emerald-600">${s.base_price.toLocaleString()} تومان</span>
                            <button onclick="deleteService(${s.id})" class="text-rose-500 hover:text-rose-700 text-sm font-bold">حذف</button>
                        </div>
                    </div>
                `;
            });
            listEl.innerHTML = html;
        }

        function deleteService(id) {
            let db = getDB();
            db.services = db.services.filter(s => s.id !== id);
            saveDB(db);
            renderServicesList();
        }

        // لود گزینه‌ها در فرم تخصیص دوره
        function loadSelectOptions() {
            const db = getDB();
            let clientSelect = document.getElementById('treatment-client');
            let serviceSelect = document.getElementById('treatment-service');

            clientSelect.innerHTML = db.clients.map(c => `<option value="${c.id}">${c.name} (کارت: ${c.card_id})</option>`).join('');
            serviceSelect.innerHTML = db.services.map(s => `<option value="${s.id}">[${s.line_name}] ${s.service_name} - ${s.base_price} ت</option>`).join('');
        }

        // ثبت تخصیص دوره درمانی
        function handleTreatmentSubmit(e) {
            e.preventDefault();
            const db = getDB();
            const client_id = parseInt(document.getElementById('treatment-client').value);
            const service_id = parseInt(document.getElementById('treatment-service').value);
            const total_sessions = parseInt(document.getElementById('treatment-total-sessions').value);

            if (!client_id || !service_id) {
                alert('لطفاً کلاینت و خدمت را به درستی انتخاب کنید.');
                return;
            }

            db.treatments.push({
                id: Date.now(),
                client_id,
                service_id,
                total_sessions,
                completed_sessions: 0,
                status: 'Active'
            });

            saveDB(db);
            alert('دوره درمانی با موفقیت برای کلاینت ثبت شد!');
            e.target.reset();
        }
    </script>
</body>
</html>
