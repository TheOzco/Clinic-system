<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>مدیریت کلینیک زیبایی</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Vazirmatn', sans-serif; background-color: #0f172a; color: #f8fafc; }
        .glass-card { background: rgba(30, 41, 59, 0.7); backdrop-filter: blur(12px); border: 1px solid rgba(255, 255, 255, 0.08); }
        .glass-input { background: #0f172a; border: 1px solid #334155; color: #f8fafc; }
        .glass-input:focus { border-color: #6366f1; outline: none; box-shadow: 0 0 0 2px rgba(99, 102, 241, 0.2); }
        ::-webkit-scrollbar { width: 6px; }
        ::-webkit-scrollbar-thumb { background: #334155; border-radius: 4px; }
    </style>
</head>
<body class="h-screen flex flex-col overflow-hidden">

    <!-- هدر بالای صفحه -->
    <header class="bg-slate-900 border-b border-slate-800 px-6 py-3 flex justify-between items-center shrink-0">
        <div class="flex items-center gap-3">
            <div class="w-9 h-9 rounded-xl bg-indigo-600 flex items-center justify-center font-black text-lg text-white shadow-lg shadow-indigo-500/30">✦</div>
            <h1 class="text-base font-bold text-white tracking-wide">سیستم اتوماسیون کلینیک زیبایی</h1>
        </div>
        <div class="flex items-center gap-3">
            <button onclick="openModal('modal-service')" class="bg-indigo-600/20 text-indigo-400 border border-indigo-500/30 hover:bg-indigo-600/30 px-3.5 py-1.5 rounded-xl text-xs font-semibold transition flex items-center gap-1.5">
                <span>⚙️</span> مدیریت لاین‌ها و خدمات
            </button>
            <button onclick="openModal('modal-new-client')" class="bg-indigo-600 hover:bg-indigo-500 text-white px-4 py-1.5 rounded-xl text-xs font-bold transition shadow-lg shadow-indigo-600/20">
                + کلاینت جدید
            </button>
        </div>
    </header>

    <!-- بدنه اصلی دو ستونه -->
    <div class="flex flex-1 overflow-hidden">

        <!-- ستون سمت راست: لیست و اسکن کلاینت‌ها -->
        <aside class="w-80 md:w-96 bg-slate-900/60 border-l border-slate-800/80 flex flex-col shrink-0">
            <!-- اسکن کارت و جستجو -->
            <div class="p-4 border-b border-slate-800/80 space-y-3">
                <div class="relative">
                    <input type="text" id="scan-input" onkeypress="if(event.key==='Enter') searchByCard()" placeholder="اسکن یا تایپ کارت اتوماسیون..." class="glass-input w-full pl-9 pr-3 py-2 rounded-xl text-xs">
                    <button onclick="searchByCard()" class="absolute left-2 top-2 text-xs bg-indigo-600 text-white px-2 py-0.5 rounded-lg">بررسی</button>
                </div>
                <input type="text" id="search-input" oninput="renderClientsList()" placeholder="جستجوی نام کلاینت..." class="glass-input w-full px-3 py-2 rounded-xl text-xs">
            </div>

            <!-- لیست کلاینت‌ها -->
            <div id="clients-sidebar" class="flex-1 overflow-y-auto p-3 space-y-2"></div>
        </aside>

        <!-- ستون سمت چپ: صفحه پروفایل کامل کلاینت انتخاب شده -->
        <main id="main-content" class="flex-1 overflow-y-auto p-6">
            <div id="empty-state" class="h-full flex flex-col items-center justify-center text-slate-500">
                <div class="text-5xl mb-3">👤</div>
                <p class="text-sm">لطفاً یک کلاینت را از لیست سمت راست انتخاب کنید یا کارت اتوماسیون را اسکن نمایید.</p>
            </div>

            <div id="client-profile-view" class="hidden max-w-4xl mx-auto space-y-6">
                
                <!-- کارت پروفایل و اطلاعات اصلی -->
                <div class="glass-card p-6 rounded-2xl relative overflow-hidden">
                    <div class="flex flex-wrap justify-between items-start gap-4 mb-6">
                        <div>
                            <div class="flex items-center gap-3">
                                <h2 id="view-name" class="text-2xl font-black text-white"></h2>
                                <span id="view-rank-badge" class="px-3 py-1 rounded-xl text-xs font-bold"></span>
                            </div>
                            <p class="text-xs text-slate-400 mt-2 flex items-center gap-4">
                                <span>📞 شماره تماس: <strong id="view-phone" class="text-slate-200"></strong></span>
                                <span>💳 کارت اتوماسیون: <strong id="view-card" class="text-indigo-400 font-mono"></strong></span>
                            </p>
                        </div>
                        <button onclick="toggleEditMode()" class="text-xs bg-slate-800 hover:bg-slate-700 text-slate-300 border border-slate-700 px-3 py-1.5 rounded-xl transition">
                            ✏️ ویرایش پروفایل
                        </button>
                    </div>

                    <!-- فرم ویرایش سریع کلاینت (در حالت عادی مخفی است) -->
                    <form id="edit-profile-form" onsubmit="saveClientEdit(event)" class="hidden border-t border-slate-700/60 pt-4 mt-4 grid grid-cols-1 sm:grid-cols-2 gap-3">
                        <input type="hidden" id="edit-id">
                        <div>
                            <label class="block text-[11px] text-slate-400 mb-1">نام و نام خانوادگی</label>
                            <input type="text" id="edit-name" required class="glass-input w-full px-3 py-1.5 rounded-lg text-xs">
                        </div>
                        <div>
                            <label class="block text-[11px] text-slate-400 mb-1">شماره تماس</label>
                            <input type="text" id="edit-phone" required class="glass-input w-full px-3 py-1.5 rounded-lg text-xs">
                        </div>
                        <div>
                            <label class="block text-[11px] text-slate-400 mb-1">شماره کارت اتوماسیون</label>
                            <input type="text" id="edit-card" required class="glass-input w-full px-3 py-1.5 rounded-lg text-xs">
                        </div>
                        <div>
                            <label class="block text-[11px] text-slate-400 mb-1">رتبه رنگی</label>
                            <select id="edit-rank" class="glass-input w-full px-3 py-1.5 rounded-lg text-xs">
                                <option value="1">برنزی (۵٪ تخفیف)</option>
                                <option value="2">نقره‌ای (۱۰٪ تخفیف)</option>
                                <option value="3">طلایی (۱۵٪ تخفیف)</option>
                                <option value="4">VIP مشکی (۲۵٪ تخفیف)</option>
                            </select>
                        </div>
                        <div class="sm:col-span-2 flex justify-between items-center pt-2">
                            <button type="button" onclick="deleteCurrentClient()" class="text-xs text-rose-400 hover:underline">حذف این کلاینت</button>
                            <div class="flex gap-2">
                                <button type="button" onclick="toggleEditMode()" class="text-xs bg-slate-800 text-slate-300 px-3 py-1.5 rounded-lg">انصراف</button>
                                <button type="submit" class="text-xs bg-indigo-600 text-white px-4 py-1.5 rounded-lg font-bold">ذخیره تغییرات</button>
                            </div>
                        </div>
                    </form>
                </div>

                <!-- بخش اختصاص دوره درمانی جدید -->
                <div class="glass-card p-5 rounded-2xl">
                    <h3 class="text-xs font-bold text-indigo-400 mb-3 flex items-center gap-1.5">
                        <span>➕</span> اختصاص دوره درمانی جدید
                    </h3>
                    <form onsubmit="assignTreatment(event)" class="grid grid-cols-1 sm:grid-cols-3 gap-3">
                        <div>
                            <label class="block text-[11px] text-slate-400 mb-1">انتخاب خدمت</label>
                            <select id="assign-service" required class="glass-input w-full px-3 py-1.5 rounded-xl text-xs"></select>
                        </div>
                        <div>
                            <label class="block text-[11px] text-slate-400 mb-1">تعداد جلسات دوره</label>
                            <input type="number" id="assign-sessions" value="4" min="1" required class="glass-input w-full px-3 py-1.5 rounded-xl text-xs">
                        </div>
                        <div>
                            <label class="block text-[11px] text-slate-400 mb-1">نام اپراتور متخصص</label>
                            <input type="text" id="assign-operator" placeholder="نام اپراتور..." required class="glass-input w-full px-3 py-1.5 rounded-xl text-xs">
                        </div>
                        <div class="sm:col-span-3 flex justify-end">
                            <button type="submit" class="bg-indigo-600 hover:bg-indigo-500 text-white text-xs font-bold px-5 py-2 rounded-xl transition shadow-lg shadow-indigo-600/20">
                                ثبت دوره برای کلاینت
                            </button>
                        </div>
                    </form>
                </div>

                <!-- روندهای درمانی کلاینت -->
                <div class="space-y-3">
                    <h3 class="text-sm font-bold text-slate-300">روندهای درمانی و سوابق جلسات</h3>
                    <div id="treatments-container" class="space-y-3"></div>
                </div>

            </div>
        </main>
    </div>

    <!-- مدال ثبت کلاینت جدید -->
    <div id="modal-new-client" class="fixed inset-0 bg-slate-950/80 backdrop-blur-sm hidden flex items-center justify-center p-4 z-50">
        <div class="glass-card w-full max-w-md p-6 rounded-2xl space-y-4">
            <div class="flex justify-between items-center border-b border-slate-700/60 pb-3">
                <h3 class="font-bold text-sm text-white">ثبت کلاینت جدید</h3>
                <button onclick="closeModal('modal-new-client')" class="text-slate-400 hover:text-white">✕</button>
            </div>
            <form onsubmit="handleNewClient(event)" class="space-y-3">
                <div>
                    <label class="block text-xs text-slate-400 mb-1">نام و نام خانوادگی</label>
                    <input type="text" id="new-name" required class="glass-input w-full px-3 py-2 rounded-xl text-xs">
                </div>
                <div>
                    <label class="block text-xs text-slate-400 mb-1">شماره تماس</label>
                    <input type="text" id="new-phone" required class="glass-input w-full px-3 py-2 rounded-xl text-xs">
                </div>
                <div>
                    <label class="block text-xs text-slate-400 mb-1">شماره کارت اتوماسیون (فیزیکی / بارکد)</label>
                    <input type="text" id="new-card" required class="glass-input w-full px-3 py-2 rounded-xl text-xs">
                </div>
                <div>
                    <label class="block text-xs text-slate-400 mb-1">رتبه رنگی تخفیف</label>
                    <select id="new-rank" class="glass-input w-full px-3 py-2 rounded-xl text-xs">
                        <option value="1">برنزی (۵٪ تخفیف)</option>
                        <option value="2">نقره‌ای (۱۰٪ تخفیف)</option>
                        <option value="3">طلایی (۱۵٪ تخفیف)</option>
                        <option value="4">VIP مشکی (۲۵٪ تخفیف)</option>
                    </select>
                </div>
                <button type="submit" class="w-full bg-indigo-600 hover:bg-indigo-500 text-white font-bold py-2.5 rounded-xl text-xs transition">
                    ذخیره و ورود به پروفایل
                </button>
            </form>
        </div>
    </div>

    <!-- مدال مدیریت خدمات و لاین‌ها -->
    <div id="modal-service" class="fixed inset-0 bg-slate-950/80 backdrop-blur-sm hidden flex items-center justify-center p-4 z-50">
        <div class="glass-card w-full max-w-lg p-6 rounded-2xl space-y-4 max-h-[90vh] flex flex-col">
            <div class="flex justify-between items-center border-b border-slate-700/60 pb-3">
                <h3 class="font-bold text-sm text-white">مدیریت لاین‌ها و خدمات کلینیک</h3>
                <button onclick="closeModal('modal-service')" class="text-slate-400 hover:text-white">✕</button>
            </div>
            
            <!-- فرم افزودن خدمت -->
            <form onsubmit="handleNewService(event)" class="grid grid-cols-1 sm:grid-cols-3 gap-2 bg-slate-900/50 p-3 rounded-xl">
                <div>
                    <label class="block text-[10px] text-slate-400 mb-1">لاین</label>
                    <select id="srv-line" class="glass-input w-full px-2 py-1.5 rounded-lg text-xs">
                        <option value="laser">لیزر</option>
                        <option value="massage">ماساژ</option>
                        <option value="skin_hair">پوست و مو</option>
                    </select>
                </div>
                <div>
                    <label class="block text-[10px] text-slate-400 mb-1">نام خدمت</label>
                    <input type="text" id="srv-name" required placeholder="عنوان..." class="glass-input w-full px-2 py-1.5 rounded-lg text-xs">
                </div>
                <div>
                    <label class="block text-[10px] text-slate-400 mb-1">قیمت پایه (تومان)</label>
                    <input type="number" id="srv-price" required placeholder="قیمت..." class="glass-input w-full px-2 py-1.5 rounded-lg text-xs">
                </div>
                <div class="sm:col-span-3">
                    <button type="submit" class="w-full bg-emerald-600 hover:bg-emerald-500 text-white font-bold py-1.5 rounded-lg text-xs">
                        + افزودن خدمت جدید
                    </button>
                </div>
            </form>

            <!-- لیست خدمات -->
            <div id="services-modal-list" class="flex-1 overflow-y-auto space-y-2 pr-1"></div>
        </div>
    </div>

    <script>
        const defaultData = {
            ranks: [
                { id: 1, name: 'برنزی', bg: 'bg-amber-900/40 text-amber-300 border-amber-700/50', discount: 5 },
                { id: 2, name: 'نقره‌ای', bg: 'bg-slate-700/40 text-slate-300 border-slate-500/50', discount: 10 },
                { id: 3, name: 'طلایی', bg: 'bg-yellow-600/30 text-yellow-300 border-yellow-500/50', discount: 15 },
                { id: 4, name: 'VIP مشکی', bg: 'bg-indigo-950 text-indigo-300 border-indigo-500/50', discount: 25 }
            ],
            clients: [],
            services: [
                { id: 1, line_name: 'laser', service_name: 'لیزر فول بادی', base_price: 1200000 },
                { id: 2, line_name: 'massage', service_name: 'ماساژ سوئدی', base_price: 700000 },
                { id: 3, line_name: 'skin_hair', service_name: 'فیشیال تخصصی VIP', base_price: 950000 }
            ],
            treatments: [],
            selectedClientId: null
        };

        function getDB() {
            let data = localStorage.getItem('clinic_v3_db');
            if (!data) {
                data = JSON.stringify(defaultData);
                localStorage.setItem('clinic_v3_db', data);
            }
            return JSON.parse(data);
        }

        function saveDB(data) {
            localStorage.setItem('clinic_v3_db', JSON.stringify(data));
        }

        // مقداردهی اولیه
        window.onload = function() {
            renderClientsList();
            renderServicesModalList();
        };

        function openModal(id) { document.getElementById(id).classList.remove('hidden'); }
        function closeModal(id) { document.getElementById(id).classList.add('hidden'); }

        // رندر لیست سمت راست کلاینت‌ها
        function renderClientsList() {
            const db = getDB();
            const query = document.getElementById('search-input').value.toLowerCase();
            const container = document.getElementById('clients-sidebar');
            
            const filtered = db.clients.filter(c => c.name.toLowerCase().includes(query) || c.card_id.includes(query));

            if (filtered.length === 0) {
                container.innerHTML = '<p class="text-center text-xs text-slate-500 py-6">کلاینتی یافت نشد</p>';
                return;
            }

            let html = '';
            filtered.forEach(c => {
                const rank = db.ranks.find(r => r.id === c.rank_id) || db.ranks[0];
                const active = db.selectedClientId === c.id ? 'bg-indigo-600/20 border-indigo-500/50' : 'bg-slate-800/40 border-slate-800 hover:bg-slate-800/80';
                
                html += `
                    <div onclick="selectClient(${c.id})" class="p-3 rounded-xl border ${active} transition cursor-pointer flex justify-between items-center">
                        <div class="space-y-1">
                            <h4 class="text-xs font-bold text-white">${c.name}</h4>
                            <p class="text-[10px] text-slate-400">کارت: <span class="font-mono text-indigo-400">${c.card_id}</span></p>
                        </div>
                        <span class="text-[10px] px-2 py-0.5 rounded-lg border ${rank.bg}">${rank.name}</span>
                    </div>
                `;
            });
            container.innerHTML = html;
        }

        // انتخاب کلاینت و نمایش صفحه اختصاصی
        function selectClient(id) {
            const db = getDB();
            db.selectedClientId = id;
            saveDB(db);

            renderClientsList();
            renderProfilePage();
        }

        // اسکن سریع با کارت
        function searchByCard() {
            const card = document.getElementById('scan-input').value.trim();
            const db = getDB();
            const client = db.clients.find(c => c.card_id === card);
            
            if (client) {
                selectClient(client.id);
                document.getElementById('scan-input').value = '';
            } else {
                alert('کلاینتی با این شماره کارت پیدا نشد.');
            }
        }

        // رندر کامل صفحه پروفایل تک کلاینت
        function renderProfilePage() {
            const db = getDB();
            const client = db.clients.find(c => c.id === db.selectedClientId);

            if (!client) {
                document.getElementById('empty-state').classList.remove('hidden');
                document.getElementById('client-profile-view').classList.add('hidden');
                return;
            }

            document.getElementById('empty-state').classList.add('hidden');
            document.getElementById('client-profile-view').classList.remove('hidden');

            const rank = db.ranks.find(r => r.id === client.rank_id) || db.ranks[0];

            document.getElementById('view-name').innerText = client.name;
            document.getElementById('view-phone').innerText = client.phone;
            document.getElementById('view-card').innerText = client.card_id;
            
            const badge = document.getElementById('view-rank-badge');
            badge.innerText = `${rank.name} (${rank.discount}٪ تخفیف)`;
            badge.className = `px-3 py-1 rounded-xl text-xs font-bold border ${rank.bg}`;

            // پر کردن مقادیر فرم ویرایش
            document.getElementById('edit-id').value = client.id;
            document.getElementById('edit-name').value = client.name;
            document.getElementById('edit-phone').value = client.phone;
            document.getElementById('edit-card').value = client.card_id;
            document.getElementById('edit-rank').value = client.rank_id;

            // پر کردن سلکت خدمات
            const sSelect = document.getElementById('assign-service');
            sSelect.innerHTML = db.services.map(s => `<option value="${s.id}">[${getLineTitle(s.line_name)}] ${s.service_name} (${s.base_price.toLocaleString()} ت)</option>`).join('');

            renderTreatmentsList(client.id);
        }

        function getLineTitle(line) {
            if(line === 'laser') return 'لیزر';
            if(line === 'massage') return 'ماساژ';
            return 'پوست و مو';
        }

        function toggleEditMode() {
            document.getElementById('edit-profile-form').classList.toggle('hidden');
        }

        // ذخیره ویرایش کلاینت
        function saveClientEdit(e) {
            e.preventDefault();
            const db = getDB();
            const id = parseInt(document.getElementById('edit-id').value);
            const client = db.clients.find(c => c.id === id);

            if (!client) return;

            client.name = document.getElementById('edit-name').value;
            client.phone = document.getElementById('edit-phone').value;
            client.card_id = document.getElementById('edit-card').value;
            client.rank_id = parseInt(document.getElementById('edit-rank').value);

            saveDB(db);
            toggleEditMode();
            renderClientsList();
            renderProfilePage();
        }

        function deleteCurrentClient() {
            if (!confirm('آیا از حذف این کلاینت مطمئن هستید؟')) return;
            const db = getDB();
            db.clients = db.clients.filter(c => c.id !== db.selectedClientId);
            db.treatments = db.treatments.filter(t => t.client_id !== db.selectedClientId);
            db.selectedClientId = null;
            saveDB(db);

            renderClientsList();
            renderProfilePage();
        }

        // ثبت دوره درمانی
        function assignTreatment(e) {
            e.preventDefault();
            const db = getDB();
            const client_id = db.selectedClientId;
            const service_id = parseInt(document.getElementById('assign-service').value);
            const total_sessions = parseInt(document.getElementById('assign-sessions').value);
            const operator_name = document.getElementById('assign-operator').value;

            db.treatments.push({
                id: Date.now(),
                client_id,
                service_id,
                total_sessions,
                completed_sessions: 0,
                operator_name
            });

            saveDB(db);
            document.getElementById('assign-operator').value = '';
            renderTreatmentsList(client_id);
        }

        // لیست دوره‌ها
        function renderTreatmentsList(clientId) {
            const db = getDB();
            const list = db.treatments.filter(t => t.client_id === clientId);
            const container = document.getElementById('treatments-container');

            if (list.length === 0) {
                container.innerHTML = '<div class="glass-card p-4 rounded-xl text-xs text-slate-500 text-center">هیچ دوره درمانی فعالی برای این کلاینت ثبت نشده است.</div>';
                return;
            }

            let html = '';
            list.forEach(t => {
                const srv = db.services.find(s => s.id === t.service_id) || { service_name: 'نامشخص', line_name: '-' };
                const remaining = t.total_sessions - t.completed_sessions;
                const progress = Math.round((t.completed_sessions / t.total_sessions) * 100);

                html += `
                    <div class="glass-card p-4 rounded-xl space-y-3">
                        <div class="flex justify-between items-start">
                            <div>
                                <span class="text-[10px] bg-indigo-900/50 text-indigo-300 border border-indigo-700/50 px-2 py-0.5 rounded-md font-bold">${getLineTitle(srv.line_name)}</span>
                                <h4 class="font-bold text-sm text-white mt-1">${srv.service_name}</h4>
                                <p class="text-xs text-slate-400 mt-0.5">اپراتور: <strong class="text-slate-200">${t.operator_name}</strong></p>
                            </div>
                            <button onclick="deleteTreatment(${t.id})" class="text-[11px] text-rose-400 hover:underline">حذف</button>
                        </div>

                        <!-- پروگرس بار -->
                        <div class="space-y-1">
                            <div class="flex justify-between text-[11px] text-slate-400">
                                <span>پیشرفت: ${progress}٪</span>
                                <span>انجام شده: <strong class="text-indigo-400">${t.completed_sessions}</strong> از ${t.total_sessions} جلسه (مانده: <strong class="text-emerald-400">${remaining}</strong>)</span>
                            </div>
                            <div class="w-full bg-slate-800 h-2 rounded-full overflow-hidden">
                                <div class="bg-indigo-500 h-full transition-all duration-300" style="width: ${progress}%"></div>
                            </div>
                        </div>

                        <div class="flex justify-end pt-1">
                            <button onclick="addSession(${t.id})" class="bg-emerald-600 hover:bg-emerald-500 text-white font-bold px-3 py-1.5 rounded-lg text-xs transition">
                                + ثبت انجام ۱ جلسه
                            </button>
                        </div>
                    </div>
                `;
            });
            container.innerHTML = html;
        }

        function addSession(treatmentId) {
            const db = getDB();
            const t = db.treatments.find(item => item.id === treatmentId);
            if (t && t.completed_sessions < t.total_sessions) {
                t.completed_sessions++;
                saveDB(db);
                renderTreatmentsList(t.client_id);
            } else {
                alert('تمامی جلسات این دوره ثبت شده‌اند.');
            }
        }

        function deleteTreatment(id) {
            if(!confirm('حذف شود؟')) return;
            const db = getDB();
            db.treatments = db.treatments.filter(t => t.id !== id);
            saveDB(db);
            renderTreatmentsList(db.selectedClientId);
        }

        // ثبت کلاینت جدید
        function handleNewClient(e) {
            e.preventDefault();
            const db = getDB();
            const name = document.getElementById('new-name').value;
            const phone = document.getElementById('new-phone').value;
            const card_id = document.getElementById('new-card').value;
            const rank_id = parseInt(document.getElementById('new-rank').value);

            if(db.clients.some(c => c.card_id === card_id)) {
                alert('این شماره کارت قبلا ثبت شده است.');
                return;
            }

            const newId = Date.now();
            db.clients.push({ id: newId, name, phone, card_id, rank_id });
            db.selectedClientId = newId;
            saveDB(db);

            closeModal('modal-new-client');
            e.target.reset();
            renderClientsList();
            renderProfilePage();
        }

        // افزودن خدمت
        function handleNewService(e) {
            e.preventDefault();
            const db = getDB();
            const line_name = document.getElementById('srv-line').value;
            const service_name = document.getElementById('srv-name').value;
            const base_price = parseFloat(document.getElementById('srv-price').value);

            db.services.push({ id: Date.now(), line_name, service_name, base_price });
            saveDB(db);
            e.target.reset();
            renderServicesModalList();
            if(db.selectedClientId) renderProfilePage();
        }

        function renderServicesModalList() {
            const db = getDB();
            const container = document.getElementById('services-modal-list');
            
            let html = '';
            db.services.forEach(s => {
                html += `
                    <div class="flex justify-between items-center bg-slate-900/80 p-2.5 rounded-lg border border-slate-800 text-xs">
                        <div>
                            <span class="text-[10px] bg-slate-800 text-slate-400 px-1.5 py-0.5 rounded">${getLineTitle(s.line_name)}</span>
                            <span class="font-bold text-white mr-2">${s.service_name}</span>
                        </div>
                        <div class="flex items-center gap-3">
                            <span class="text-emerald-400 font-bold">${s.base_price.toLocaleString()} ت</span>
                            <button onclick="deleteService(${s.id})" class="text-rose-400 hover:underline">حذف</button>
                        </div>
                    </div>
                `;
            });
            container.innerHTML = html;
        }

        function deleteService(id) {
            let db = getDB();
            db.services = db.services.filter(s => s.id !== id);
            saveDB(db);
            renderServicesModalList();
            if(db.selectedClientId) renderProfilePage();
        }
    </script>
</body>
</html>
